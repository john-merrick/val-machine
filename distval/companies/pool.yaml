# Pool Corporation (POOL) — manually keyed from 10-K filings
# Source: POOL 10-K FY2023 filed 2024-02-22 (primary), with 10-year history for mid-cycle derivation.
# All dollar values in millions USD.
#
# Business: World's largest wholesale distributor of swimming pool and related products.
# ~60-65% of revenue is non-discretionary maintenance/repair; rest is new construction and remodeling.
# Revenue peaked at $6,179M in FY2022 (pandemic pool-build boom + COVID demand pull-forward),
# normalising to $5,305M in FY2023. Recovery forecast assumes housing activity rebounds gradually.
#
# Mid-cycle gross margin derivation (FY2014–2023, per 10-K segment history):
#   2014: 28.2%, 2015: 28.6%, 2016: 28.6%, 2017: 28.7%, 2018: 28.9%,
#   2019: 29.1%, 2020: 28.4%, 2021: 29.3%, 2022: 29.7%, 2023: 28.9%
#   Mean: 28.8% — very stable; no structural distortion years.
#   Mid-cycle gross margin used: 29.0% (slight premium to mean; pricing power has held through cycles).
#
# Mid-cycle opex/sales (SG&A as % of revenue, 10-year avg ~17.8%):
#   FY2023: SG&A $990M / revenue $5,305M = 18.7% (elevated; volume deleveraging from 2022 peak).
#   Normalised to 18.0% at mid-cycle scale ($5,700M+), consistent with FY2018-2019 levels.
#
# Mid-cycle EBIT = Revenue * (gross_margin - opex_pct) = 5,700 * (0.290 - 0.180) = 5,700 * 0.110 = 627
# Rounded to 630 as a conservatively estimated mid-cycle figure.

ticker: POOL
forecast_years: 5

# Revenue forecast: Recovery from FY2023 trough ($5,305M) at ~5% CAGR as housing normalises.
# New pool starts depressed in FY2023-24; rebound expected FY2025+ as affordability improves.
revenue:
  - 5350.0
  - 5620.0
  - 5900.0
  - 6200.0
  - 6500.0

# Gross margin: stable band; creeping toward 29.5% as pricing leverage reasserts post-trough.
gross_margin:
  - 0.291
  - 0.292
  - 0.294
  - 0.295
  - 0.295

# Opex as % of sales (SG&A incl. D&A — engine treats d_and_a == capex so D&A nets out of FCF).
# Improving as volume recovers and fixed costs are leveraged.
opex_pct_sales:
  - 0.184
  - 0.182
  - 0.180
  - 0.179
  - 0.179

# Working capital days — computed as days-of-revenue (engine base is revenue, not COGS).
# FY2023 actuals: inventory $1,040M, receivables $430M, payables $415M; revenue $5,305M.
dio: 71.6   # inventory days: $1,040M / $5,305M * 365
dso: 29.6   # receivable days: $430M / $5,305M * 365
dpo: 28.6   # payable days: $415M / $5,305M * 365

maintenance_capex_pct_sales: 0.005  # FY2023: ~$26M / $5,305M ≈ 0.5% (very asset-light distributor)
tax_rate: 0.254                     # FY2023 effective rate 25.4%

# Mid-cycle EBIT: $5,700M mid-cycle revenue * 11.0% mid-cycle EBIT margin
mid_cycle_ebit: 630.0

# Quality scores — dominant scale in a consolidating distribution channel
duration_score: 8    # installed base of 5-6M US pools drives recurring maintenance demand
stability_score: 7   # 60-65% maintenance/repair is non-discretionary; new construction cyclical

# Bridge items (in millions) — no material non-operating assets to add
other_elements: {}

# Balance sheet (FY2023, in millions) — for reference; passed at CLI call site
# total_debt: 1526.0
# cash: 57.0
# net_debt: 1469.0
# shares_diluted: 39.5
# minority_interest: 0.0
# spot_price: ~$335 (approx at time of model build, Feb 2024)
