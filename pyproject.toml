[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "edgartools>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
include = ["distval*"]

[tool.pytest.ini_options]
testpaths = ["distval/tests"]
addopts = "--tb=short"
empty_parameter_set_mark = "skip"
